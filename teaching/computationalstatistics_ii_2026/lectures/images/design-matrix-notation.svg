<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Rows and columns of the design matrix X</title>
  <desc id="desc">A rectangular matrix with n rows and p+1 columns. Column 0 contains ones for the unpenalised intercept. A blue horizontal strip highlights row i, X subscript i comma dot. An orange vertical strip highlights column j, X subscript dot comma j. Arrows connect each label to its highlighted strip.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2166ac"/></marker>
    <marker id="orange-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker>
  </defs>
  <g font-family="Arial, sans-serif" fill="#243247">
    <text x="540" y="36" text-anchor="middle" font-size="25">p + 1 columns: intercept + p predictors</text>
    <path d="M340 67 V54 H740 V67" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="340" y="88" width="400" height="280" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <rect x="340" y="88" width="80" height="280" fill="#e2e8f0"/>
    <rect x="580" y="88" width="80" height="280" fill="#ffedd5"/>
    <rect x="340" y="208" width="400" height="40" fill="#dbeafe"/>
    <rect x="580" y="208" width="80" height="40" fill="#ede2d5"/>
    <path d="M420 88 V368 M500 88 V368 M580 88 V368 M660 88 V368 M340 128 H740 M340 168 H740 M340 208 H740 M340 248 H740 M340 288 H740 M340 328 H740" stroke="#94a3b8" stroke-width="1" fill="none"/>
    <rect x="580" y="88" width="80" height="280" fill="none" stroke="#b45309" stroke-width="3"/>
    <rect x="340" y="208" width="400" height="40" fill="none" stroke="#2166ac" stroke-width="3"/>
    <path d="M328 82 H315 V374 H328 M752 82 H765 V374 H752" fill="none" stroke="#243247" stroke-width="3"/>
    <text x="284" y="166" text-anchor="end" font-family="Georgia, serif" font-size="38" font-style="italic">X =</text>
    <text x="32" y="206" fill="#2166ac" font-family="Georgia, serif" font-size="34">X<tspan baseline-shift="sub" font-size="23">i,·</tspan></text>
    <text x="32" y="250" fill="#2166ac" font-size="24">Row i: one observation</text>
    <text x="32" y="283" fill="#2166ac" font-size="21">1 × (p + 1)</text>
    <path d="M165 198 L240 198 L240 227 L330 227" fill="none" stroke="#2166ac" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <text x="810" y="118" fill="#b45309" font-family="Georgia, serif" font-size="34">X<tspan baseline-shift="sub" font-size="23">·,j</tspan></text>
    <text x="810" y="160" fill="#b45309" font-size="24">Column j: one predictor</text>
    <text x="810" y="193" fill="#b45309" font-size="21">n × 1</text>
    <path d="M798 112 L710 112 L668 135" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#orange-arrow)"/>
    <path d="M778 88 H789 V368 H778" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="812" y="319" font-size="24">n observations</text>
    <text x="812" y="351" font-size="24">(rows)</text>
    <text x="380" y="116" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="156" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="196" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="236" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="276" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="316" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="356" text-anchor="middle" font-size="24">1</text>
    <text x="380" y="401" text-anchor="middle" font-size="20">Column 0: intercept</text>
    <text x="380" y="427" text-anchor="middle" font-size="19">unpenalised</text>
    <text x="650" y="460" text-anchor="middle" font-size="23">The dot means “all entries” in that direction.</text>
  </g>
</svg>
