    <dc:title>nn relu design</dc:title>
    <dc:date>2026-09-22T15:53:57.790279</dc:date>
    <dc:description>A triangular target is zero for x at most zero, rises with slope one to height one at x equals one, falls with slope minus one to zero at x equals two, and remains zero thereafter. The four slopes are labelled.</dc:description>
