  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>nn step ramp</dc:title>
    <dc:date>2026-09-22T15:53:58.009538</dc:date>
    <dc:description>The blue target is the indicator of x at least zero, with an open endpoint at zero height and a closed endpoint at height one. A purple continuous ramp agrees outside minus delta to delta and crosses height one half at zero. Two pale red triangles indicate absolute error. The tick labels use symbolic delta; the drawing illustrates delta equal to 0.4.</dc:description>
    <dc:format>image/svg+xml</dc:format>
